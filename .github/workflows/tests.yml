name: Pytest Unit Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - uses: actions/setup-python@v5
        name: Setup Python
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e . pytest httpx
      - name: Run tests
        run: pytest
