name: kla_module
services:
  kla_module:
    container_name: kla_module
    image: ghcr.io/ad-sdl/kla_module
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - ghcr.io/ad-sdl/kla_module:latest
        - ghcr.io/ad-sdl/kla_module:dev
    env_file: .env
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
    command: python -m kla_rest_node --kla_url ${KLA_URL:-http://127.0.0.1:8080}
